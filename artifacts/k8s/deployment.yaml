apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-on
  labels:
    app: go-on
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-on
  template:
    metadata:
      labels:
        app: go-on
    spec:
      containers:
        - name: go-on
          image: ghcr.io/example/go-on:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: GO_ON_ENTRY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: go-on-secrets
                  key: entry_api_key
          args:
            - "--config"
            - "/etc/go-on/config.toml"
          volumeMounts:
            - name: config
              mountPath: /etc/go-on
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: go-on-config
