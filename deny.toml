# cargo-deny configuration
[advisories]
vulnerability = "deny"
unmaintained = "warn"
unsound = "deny"
notice = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-DFS-2016", "Zlib", "OpenSSL"]
deny = []
copyleft = "deny"
allow-osi-fsf-free = "neither"
default = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
