# ============================================================
# go-on Multi-Users Server Profile (multi-users-server)
#   Build:   cargo build --no-default-features -F multi-users-server
#   Backend: PostgreSQL + pgvector, multi-user production
#   Full multi-user features: CORS, JWT-like auth, RBAC, tenant quotas
#   NOTE:    Set GO_ON_PG_CONNECTION_STRING (or DATABASE_URL / PG_DSN /
#            GO_ON_DATABASE_URL) to a PostgreSQL DSN before startup.
#            Set GO_ON_ENTRY_API_KEY for gateway auth.
#            Set GO_ON_USER_AUTH_TOKEN_SECRET for user token signing.
#            Set GO_ON_CORS_ALLOWED_ORIGINS for allowed origins (comma-separated).
# ============================================================

schema_version = "1.0.0"
default_phase = "think"
model_selection_mode = "adaptive"

# ── Cache (PostgreSQL in production, SQLite fallback for dev) ──────────
# In production with multi-users-server, set connection_string:
#   sslmode=verify-full — full TLS with CA verification
#   sslmode=require     — TLS with self-signed certs
#   (omit sslmode)      — unencrypted (dev only)
# Example: cache.connection_string = "postgres://${DB_USER}:${DB_PASS}@${DB_HOST}/goon_cache?sslmode=verify-full"
# Optional read-replica for read/write splitting:
# cache.read_replica_connection_string = "postgres://${DB_USER}:${DB_PASS}@${DB_REPLICA_HOST}/goon_cache?sslmode=verify-full"
[cache]
enabled = true
path = "sqlite3/acp_cache.sqlite3"
default_ttl_seconds = 3600
max_entries = 50000

# ── Vector Store (pgvector in production, sqlite-vec fallback for dev) ─
# In production with multi-users-server, set connection_string:
#   sslmode=verify-full — full TLS with CA verification
#   sslmode=require     — TLS with self-signed certs
#   (omit sslmode)      — unencrypted (dev only)
# Example: vector.connection_string = "postgres://${DB_USER}:${DB_PASS}@${DB_HOST}/goon_vector?sslmode=verify-full"
# Optional read-replica for read/write splitting:
# vector.read_replica_connection_string = "postgres://${DB_USER}:${DB_PASS}@${DB_REPLICA_HOST}/goon_vector?sslmode=verify-full"
[vector]
enabled = true
auto_mode = false
path = "sqlite3/acp_vector.sqlite3"
dimensions = 768
min_query_chars = 80
top_k = 10
min_similarity = 0.70
max_snippet_chars = 800
max_entries = 200000
summary_enabled = true
summary_trigger_messages = 8
summary_max_chars = 1200

# ── Runtime Configuration ─────────────────────────────────────────────
[protocol]
mode = "adaptive"

[runtime]
maintenance_interval_seconds = 60
health_interval_seconds = 60
shutdown_drain_seconds = 60
acp_http_bind_addr = "0.0.0.0:8090"
production_strict = true

# ── Gateway Entry Auth (shared API key for all ingress) ───────────────
entry_auth_enabled = true
entry_auth_api_key_env = "GO_ON_ENTRY_API_KEY"
entry_rate_limit_rpm = 5000
entry_rate_limit_burst = 1000

# ── User Authentication (per-user JWT-like tokens) ────────────────────
user_auth_enabled = true
user_auth_token_secret_env = "GO_ON_USER_AUTH_TOKEN_SECRET"
user_auth_token_ttl_seconds = 86400
request_signing_enabled = false

# ── Cross-Origin Resource Sharing (CORS) ──────────────────────────────
# Comma-separated list of allowed origins.
# Set GO_ON_CORS_ALLOWED_ORIGINS env var at runtime, or configure here.
# Use "*" to allow all origins (development only).
# For production, set to the actual origin of your frontend.
cors_allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000", "https://localhost:3000"]

# ── Tenant Resource Quotas ────────────────────────────────────────────
tenant_default_daily_token_limit = 1000000
tenant_default_concurrent_tasks = 10
tenant_default_daily_api_calls = 10000

# ── Observability ─────────────────────────────────────────────────────
otel_enabled = true
otel_exporter = "otlp"
otel_endpoint = "http://localhost:4317"
otel_service_name = "go-on-multi"
otel_sample_ratio = 0.5
trace_slow_top_n = 50
evolution_enabled = false

# ── Skills ────────────────────────────────────────────────────────────
skills_enabled = false
skills_import_enabled = false
skills_allowed_sources = []
skills_require_sha256 = true
skills_allow_floating_ref = false
skills_cache_dir = "skills_cache"

# ── Governance ────────────────────────────────────────────────────────
governance_enabled = true
governance_policy_mode = "enforce"

# ── i18n ───────────────────────────────────────────────────────────────
i18n_default_language = "en-US"

# ── Agents ────────────────────────────────────────────────────────────
[agents]

[agents.deepseek]
type = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"
supports_system = true

[agents.copilot]
type = "copilot"
api_key_env = "keyring://go-on/copilot_api_key"
model = "gpt-4o"
supports_system = true

# ── Multi-User Access: RBAC roles can be extended via config ──────────
# Each agent can have rbac_roles that limit which users can access it.
# e.g. agents.deepseek.rbac_roles = ["admin", "user"]

# ── Flow Configuration ────────────────────────────────────────────────
[flow]
name = "Multi-User Adaptive"
phases = ["think", "act", "check", "done"]

[phases.think]
description = "Think — analyze, plan, gather context"
agents = ["deepseek", "copilot"]
fallback = true

[phases.think.options]
request_timeout_seconds = 120
review_timeout_seconds = 60
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 8
global_max_inflight = 128

[phases.act]
description = "Act — execute, generate, implement"
agents = ["deepseek", "copilot"]
fallback = true

[phases.act.options]
request_timeout_seconds = 300
review_timeout_seconds = 120
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 24
global_max_inflight = 128

[phases.check]
description = "Check — verify, validate, review results"
agents = ["deepseek", "copilot"]
fallback = true

[phases.check.options]
request_timeout_seconds = 120
review_timeout_policy = "reject"
review_min_response_chars = 12
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 16
global_max_inflight = 128

[phases.done]
description = "Done — finalize, deliver, complete"
agents = []
fallback = false

[phases.done.options]
request_timeout_seconds = 90
summary_enabled = true
phase_max_inflight = 8
global_max_inflight = 64
