# ============================================================
# go-on Zed Agent Server Config
#   Optimized for Zed editor's agent_servers integration (ACP).
#   Usage (stdio): go-on --config zed-config.toml --protocol-mode acp_stdio
#   Usage (HTTP):  go-on --config zed-config.toml --protocol-mode acp_http --acp-http-bind 127.0.0.1:8090
# ============================================================

schema_version = "1.0.0"
default_phase = "think"
model_selection_mode = "adaptive"

[cache]
enabled = true
path = "sqlite3/acp_cache.sqlite3"
default_ttl_seconds = 3600
max_entries = 5000

[vector]
enabled = true
auto_mode = true
path = "sqlite3/acp_vector.sqlite3"
dimensions = 192
min_query_chars = 80
top_k = 2
min_similarity = 0.82
max_snippet_chars = 800
max_entries = 10000
summary_enabled = true
summary_trigger_messages = 8
summary_max_chars = 1200

[runtime]
protocol_mode = "acp"
deployment_target = "local-dev"
maintenance_interval_seconds = 60
health_interval_seconds = 120
shutdown_drain_seconds = 30
sqlite_vacuum_interval_cycles = 60
acp_http_bind_addr = "127.0.0.1:8090"
entry_auth_enabled = false
entry_rate_limit_rpm = 240
entry_rate_limit_burst = 60
production_strict = false
governance_enabled = true
governance_policy_mode = "advisory"
i18n_default_language = "en-US"
skills_enabled = true
skills_import_enabled = false
skills_allowed_sources = ["local:*"]
skills_require_sha256 = true
skills_allow_floating_ref = false
skills_cache_dir = "skills_cache"

# ── Observability / OpenTelemetry ────────────────────────────────────
otel_enabled = true
otel_exporter = "otlp"
otel_endpoint = "http://localhost:4317"
otel_service_name = "go-on-zed"
otel_sample_ratio = 1.0
trace_slow_top_n = 20

[startup_context]
enabled = true
readme_max_chars = 2000
recent_commits = 5

[autotune]
enabled = false

# ── Agents ───────────────────────────────────────────────────────────
[agents]

[agents.deepseek]
type = "deepseek"
api_key_env = "keyring://go-on/deepseek_api_key"
model = "deepseek-v4-flash"
supports_system = true

[agents.copilot]
type = "copilot"
api_key_env = "keyring://go-on/copilot_api_key"
model = "gpt-4o"
supports_system = true

# ── Flow ─────────────────────────────────────────────────────────────
[flow]
name = "go-on-zed"
workflow_type = "auto"
phases = ["think", "act", "check", "review", "done"]

[phases.think]
description = "Think — analyze requirements, gather context, plan"
agents = ["deepseek", "copilot"]
fallback = true

[phases.think.options]
request_timeout_seconds = 120
review_timeout_seconds = 60
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 4
global_max_inflight = 32

[phases.act]
description = "Act — generate code, implement changes"
agents = ["deepseek", "copilot"]
fallback = true

[phases.act.options]
request_timeout_seconds = 300
review_timeout_seconds = 120
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 8
global_max_inflight = 32

[phases.check]
description = "Check — validate, review, verify quality"
agents = ["deepseek", "copilot"]
fallback = true

[phases.check.options]
request_timeout_seconds = 120
review_timeout_policy = "reject"
review_min_response_chars = 12
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 6
global_max_inflight = 32

[phases.review]
description = "Review — validate changes, inspect diff, verify quality"
agents = ["deepseek", "copilot"]
fallback = true

[phases.review.options]
request_timeout_seconds = 120
review_timeout_seconds = 60
review_timeout_policy = "reject"
review_min_response_chars = 12
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 4
global_max_inflight = 32

[phases.done]
description = "Done — finalize, summarize, deliver results"
agents = []
fallback = false

[phases.done.options]
request_timeout_seconds = 90
summary_enabled = true
phase_max_inflight = 4
global_max_inflight = 16
