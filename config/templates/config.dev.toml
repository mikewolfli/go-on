# ============================================================
# go-on Development Workflow Config Template
#
# NOTE: This file has been consolidated into config.general.toml.
# The only difference between dev and general workflows is the
# phase set:
#   - dev:      planning → coding → review → delivery
#   - general:  gathering → thinking → executing → validating → closing
#
# To use the dev workflow:
#   1. Copy config.general.toml → config.toml
#   2. Change [flow] section:
#        [flow]
#        name = "Development"
#        workflow_type = "dev"
#        phases = ["planning", "coding", "review", "delivery"]
#   3. Add [phases.planning], [phases.coding], [phases.review], [phases.delivery]
#      matching the structure in config.general.toml's phase definitions
#   4. Add your AI provider API keys
#   5. Run: go-on --config config.toml
# ============================================================

schema_version = "1.0.0"
default_phase = "planning"
model_selection_mode = "adaptive"

# All other settings match config.general.toml defaults.
# See config/general.toml for the full template.
