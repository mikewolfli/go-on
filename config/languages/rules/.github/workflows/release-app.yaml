name: Release App Bundles

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            target: x86_64-unknown-linux-gnu
            archive: go-on-linux.tar.gz
            executable: go-on
          - os: macos-latest
            label: macos
            target: aarch64-apple-darwin
            archive: go-on-macos.tar.gz
            executable: go-on
          - os: windows-latest
            label: windows
            target: x86_64-pc-windows-msvc
            archive: go-on-windows.zip
            executable: go-on.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify project structure
        shell: bash
        run: |
          echo "Current working directory: $(pwd)"
          echo "Checking for required directories..."
          test -d RULES || (echo "ERROR: RULES directory not found" && exit 1)
          test -d languages || (echo "ERROR: languages directory not found" && exit 1)
          echo "✓ Project structure verified"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Linux and macOS bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          STAGE_DIR="dist/stage"
          mkdir -p "$STAGE_DIR"
          
          # Copy binary
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$STAGE_DIR/${{ matrix.executable }}"
          
          # Copy supporting files (fail early if missing)
          if [ ! -d RULES ]; then echo "ERROR: RULES not found in $(pwd)"; exit 1; fi
          if [ ! -d languages ]; then echo "ERROR: languages not found in $(pwd)"; exit 1; fi
          
          cp -R RULES "$STAGE_DIR/RULES"
          cp -R languages "$STAGE_DIR/languages"
          tar -czf "dist/${{ matrix.archive }}" -C "$STAGE_DIR" .

      - name: Package Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-Not (Test-Path "RULES")) { Write-Error "RULES not found in $(Get-Location)"; exit 1 }
          if (-Not (Test-Path "languages")) { Write-Error "languages not found in $(Get-Location)"; exit 1 }
          
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/stage/${{ matrix.executable }}"
          Copy-Item "RULES" "dist/stage/RULES" -Recurse
          Copy-Item "languages" "dist/stage/languages" -Recurse
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
