# ============================================================
# go-on Universal Workflow Config (local)
#   Default: SQLite + sqlite-vec, single-user development
#   Build:   cargo build (default feature = local)
#   Usage:   go-on --config config.toml
# ============================================================

schema_version = "1.0.0"
default_phase = "think"
model_selection_mode = "adaptive"

# ── Governance / Feature flags (root-level via #[serde(flatten)]) ─────
governance_enabled = true
governance_policy_mode = "advisory"

[cache]
enabled = true
path = "sqlite3/acp_cache.sqlite3"
default_ttl_seconds = 3600
max_entries = 5000
# Wire the durable cache as the token cache's L3 layer (cross-restart reuse).
# Set to false to keep the SQLite store healthcheck-only (saves one read/write
# per cache miss). Defaults to true when the [cache] section is enabled.
persist_enabled = true

[vector]
enabled = true
auto_mode = true
path = "sqlite3/acp_vector.sqlite3"
dimensions = 192
min_query_chars = 80
top_k = 2
min_similarity = 0.82
max_snippet_chars = 800
max_entries = 10000
summary_enabled = true
summary_trigger_messages = 8
summary_max_chars = 1200

[runtime]
deployment_target = "local-dev"
acp_http_bind_addr = "127.0.0.1:8090"
maintenance_interval_seconds = 60
health_interval_seconds = 120
shutdown_drain_seconds = 30
entry_auth_enabled = false
entry_auth_api_key_env = "GO_ON_ENTRY_API_KEY"
entry_rate_limit_rpm = 240
entry_rate_limit_burst = 60
production_strict = false
i18n_default_language = "en-US"
skills_enabled = true
skills_import_enabled = false
skills_allowed_sources = ["local:*"]
skills_require_sha256 = true
skills_allow_floating_ref = false
skills_cache_dir = "skills_cache"

# ── Observability / OpenTelemetry ────────────────────────────────────
otel_enabled = true
otel_exporter = "otlp"
otel_endpoint = "http://localhost:4317"
otel_service_name = "go-on-local"
otel_sample_ratio = 1.0
trace_slow_top_n = 20
# Self-evolution loop (BLUE56-B03): default OFF — when enabled, the loop can
# auto-apply LLM-generated patches to src/**/*.rs. Enable only in explicit
# development mode.
evolution_enabled = false

[startup_context]
enabled = true
readme_max_chars = 2000
recent_commits = 5

[protocol]
mode = "adaptive"

[agents]
[agents.deepseek]
type = "deepseek"
api_key_env = "keyring://go-on/deepseek_api_key"
model = "deepseek-v4-flash"
supports_system = true

[agents.copilot]
type = "copilot"
api_key_env = "keyring://go-on/copilot_api_key"
model = "gpt-4o"
supports_system = true

[flow]
name = "Universal Adaptive"
phases = ["think", "act", "check", "done"]

[phases.think]
description = "Think — analyze, plan, gather context"
agents = ["deepseek", "copilot"]
fallback = true

[phases.think.options]
request_timeout_seconds = 120
review_timeout_seconds = 60
cache_enabled = true
vector_enabled = true
summary_enabled = true
# REDUCED: 8 -> 4 to lower concurrent memory usage
phase_max_inflight = 4
# REDUCED: 128 -> 32 to prevent memory spikes from many concurrent operations
global_max_inflight = 32

[phases.act]
description = "Act — execute, generate, implement"
agents = ["deepseek", "copilot"]
fallback = true

[phases.act.options]
request_timeout_seconds = 300
review_timeout_seconds = 120
cache_enabled = true
vector_enabled = true
summary_enabled = true
# REDUCED: 24 -> 8 to lower concurrent memory usage
phase_max_inflight = 8
# REDUCED: 128 -> 32
global_max_inflight = 32

[phases.check]
description = "Check — verify, validate, review results"
agents = ["deepseek", "copilot"]
fallback = true

[phases.check.options]
request_timeout_seconds = 120
review_timeout_policy = "reject"
review_min_response_chars = 12
cache_enabled = true
vector_enabled = true
summary_enabled = true
# REDUCED: 16 -> 6
phase_max_inflight = 6
# REDUCED: 128 -> 32
global_max_inflight = 32

[phases.done]
description = "Done — finalize, deliver, complete"
agents = []
fallback = false

[phases.done.options]
request_timeout_seconds = 90
summary_enabled = true
# REDUCED: 8 -> 4
phase_max_inflight = 4
# REDUCED: 64 -> 16
global_max_inflight = 16
