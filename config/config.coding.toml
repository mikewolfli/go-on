# ============================================================
# go-on Coding Phase Config (profile-local)
#   Dedicated coding-phase workflow with coding-focused defaults.
#   Perfect for pairing with IDE integrations (Zed, VS Code).
#   Build:   cargo build (default feature = profile-local)
#   Phase 4: 14 buses, 21 F-GAP modules, i18n ~95%
#   Usage:   go-on --config config.coding.toml --phase coding
# ============================================================

default_phase = "coding"
model_selection_mode = "adaptive"

[protocol]
mode = "acp_stdio"

[cache]
enabled = true
path = "acp_cache.sqlite3"
default_ttl_seconds = 7200
max_entries = 10000

[vector]
enabled = true
auto_mode = true
path = "acp_vector.sqlite3"
dimensions = 192
min_query_chars = 40
top_k = 4
min_similarity = 0.80
max_snippet_chars = 1200
max_entries = 20000
summary_enabled = true
summary_trigger_messages = 6
summary_max_chars = 1500

[runtime]
maintenance_interval_seconds = 120
health_interval_seconds = 60
shutdown_drain_seconds = 15
sqlite_vacuum_interval_cycles = 120
entry_auth_enabled = false
entry_rate_limit_rpm = 480
entry_rate_limit_burst = 120
production_strict = false
i18n_enabled = true
i18n_default_language = "en_US"
skills_enabled = true
skills_import_enabled = true
skills_allowed_sources = ["local:*", "github:*"]
skills_require_sha256 = true
skills_cache_dir = "skills_cache"
governance_enabled = true
governance_policy_mode = "advisory"

[agents]

[agents.deepseek]
type = "deepseek"
api_key_env = "keyring://go-on/deepseek_api_key"
model = "deepseek-chat"
supports_system = true

[flow]
name = "Coding-First Adaptive"
phases = ["coding"]
workflow_type = "auto"

[phases.coding]
description = "Coding phase"
agents = ["deepseek"]
fallback = true

[phases.coding.options]
request_timeout_seconds = 180
review_timeout_seconds = 90
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 32
global_max_inflight = 128
