# ============================================================
# go-on Simple Server Profile (profile-simple-server)
#   Build:   cargo build --no-default-features -F profile-simple-server
#   Backend: SQLite + sqlite-vec, single-server deployment
#   Phase 4: 14 buses, 21 F-GAP modules, i18n ~95%
#   Tests:   905+ (805 unit + 86 RPC + 14 transport)
# ============================================================

schema_version = "1.0.0"
default_phase = "think"
model_selection_mode = "adaptive"

[protocol]
mode = "acp_http"

[cache]
enabled = true
path = "/var/lib/go-on/cache.sqlite3"
default_ttl_seconds = 7200
max_entries = 20000

[vector]
enabled = true
auto_mode = false
path = "/var/lib/go-on/vector.sqlite3"
dimensions = 384
min_query_chars = 80
top_k = 5
min_similarity = 0.75
max_snippet_chars = 800
max_entries = 50000
summary_enabled = true
summary_trigger_messages = 8
summary_max_chars = 1200

[runtime]
maintenance_interval_seconds = 60
health_interval_seconds = 120
shutdown_drain_seconds = 45
sqlite_vacuum_interval_cycles = 60
acp_http_bind_addr = "127.0.0.1:8090"
entry_auth_enabled = true
entry_auth_api_key_env = "GO_ON_SERVER_API_KEY"
entry_rate_limit_rpm = 1000
entry_rate_limit_burst = 200
production_strict = true
otel_enabled = true
otel_exporter = "otlp"
otel_service_name = "go-on-server"
otel_sample_ratio = 1.0
trace_slow_top_n = 20
i18n_enabled = true
i18n_default_language = "en_US"
skills_enabled = false
skills_import_enabled = false
skills_allowed_sources = []
skills_require_sha256 = true
skills_cache_dir = "skills_cache"
governance_enabled = true
governance_policy_mode = "enforce"

[agents]

[agents.deepseek]
type = "deepseek"
api_key_env = "keyring://go-on/deepseek_api_key"
model = "deepseek-v4-flash"
supports_system = true

[flow]
name = "Server Adaptive"
phases = ["think", "act", "check", "done"]

[phases.think]
description = "Think — analyze, plan, gather context"
agents = ["deepseek"]
fallback = true

[phases.think.options]
request_timeout_seconds = 120
review_timeout_seconds = 60
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 8
global_max_inflight = 128

[phases.act]
description = "Act — execute, generate, implement"
agents = ["deepseek"]
fallback = true

[phases.act.options]
request_timeout_seconds = 300
review_timeout_seconds = 120
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 24
global_max_inflight = 128

[phases.check]
description = "Check — verify, validate, review results"
agents = ["deepseek"]
fallback = true

[phases.check.options]
request_timeout_seconds = 120
review_timeout_policy = "reject"
review_min_response_chars = 12
cache_enabled = true
vector_enabled = true
summary_enabled = true
phase_max_inflight = 16
global_max_inflight = 128

[phases.done]
description = "Done — finalize, deliver, complete"
agents = ["deepseek"]
fallback = false

[phases.done.options]
request_timeout_seconds = 90
summary_enabled = true
phase_max_inflight = 8
global_max_inflight = 64
