[package]
name = "go-on-web-search"
version = "1.5.0"
edition = "2021"
description = "Web search API client for go-on - searches the web using configured providers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
