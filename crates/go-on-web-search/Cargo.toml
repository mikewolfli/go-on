[package]
name = "go-on-web-search"
version = "1.6.0"
edition = "2021"
license.workspace = true
description = "Web search API client for go-on - searches the web using configured providers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
anyhow = "1"
