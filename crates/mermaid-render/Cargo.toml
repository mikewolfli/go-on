[package]
name = "go-on-mermaid-render"
version = "1.5.0"
edition = "2021"
description = "Framework-agnostic Mermaid diagram renderer. Takes mermaid source text and a color theme, outputs SVG or rasterized RGBA pixels. No GUI framework dependency."

[dependencies]
merman = { version = "0.8.0-alpha.3", default-features = false, features = ["render"] }
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
quick-xml = { version = "0.37", features = ["serialize"] }
serde_json = "1"
anyhow = "1"
