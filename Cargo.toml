[package]
name = "go-on"
version = "0.9.5"
edition = "2021"

[lib]
name = "go_on"
path = "src/lib.rs"

[features]
# ── Build profiles (MUTUALLY EXCLUSIVE) ──────────────────────────────────────
# Exactly ONE profile must be selected. Default is profile-local.
#
# profile-local: single-user local tool; SQLite cache + adaptive vector store
#                Only minimal sub-buses (core dual buses: HarnessBus + CapabilityBus)
#                Fastest startup, minimal dependencies
#
# profile-simple-server: single-server deployment; SQLite cache + required sqlite-vec
#                        Core dual buses + orchestration/reputation
#
# profile-multi-users-server: multi-user production; PostgreSQL cache + pgvector
#                             All sub-buses (tool, observability, optimization, memory, protocol, orchestration, distributed-memory)
#
# Compile-time validation is implicit via Cargo's feature conflict mechanics.
# Only one profile should be selected at a time (enforced by convention).
# No explicit #[cfg] assertions exist in main.rs.
#
# Build examples:
#   cargo build                                                    # uses default profile-local
#   cargo build --no-default-features --features profile-local
#   cargo build --no-default-features --features profile-simple-server
#   cargo build --no-default-features --features profile-multi-users-server
default = ["profile-local"]

# Sub-bus feature gates (profile-conditional compilation)
sub-bus-tool = []
sub-bus-observability = []
sub-bus-optimization = []
sub-bus-memory = []
sub-bus-protocol = []
sub-bus-orchestration = []
sub-bus-distributed-memory = []

# Profile definitions (mutually exclusive via compile-time assertions)
profile-local = ["backend-sqlite"]
profile-simple-server = ["backend-sqlite", "sub-bus-orchestration", "sub-bus-tool"]
profile-multi-users-server = ["backend-postgres", "sub-bus-tool", "sub-bus-observability", "sub-bus-optimization", "sub-bus-memory", "sub-bus-protocol", "sub-bus-orchestration", "sub-bus-distributed-memory"]

# Backend implementations
backend-sqlite = ["dep:rusqlite", "dep:sqlite-vec"]
backend-postgres = ["dep:postgres", "dep:pgvector"]

# Legacy aliases (kept for backward compatibility)
local-acp-sqlite = ["profile-local"]
server-mcp-postgres = ["profile-multi-users-server"]

[dependencies]
tokio = { version = "1", features = ["full"] }
regex = "1"
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json", "stream", "form"] }
anyhow = "1"
thiserror = "2.0.18"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry-stdout = "0.31"
lazy_static = "1.4"
rusqlite = { version = "0.39.0", features = ["bundled"], optional = true }
sha2 = "0.11.0"
toml = "1.1.0"
keyring = { version = "3" }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
glob = "0.3"
tempfile = "3"
base64 = "0.22"
postgres = { version = "0.19", optional = true }
pgvector = { version = "0.4", features = ["postgres"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
fs2 = "0.4"
serial_test = "3"
