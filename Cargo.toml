[workspace]
members = [".", "gui", "sdk/rust", "test_i18n"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
thiserror = "2"
futures = "0.3"
futures-util = "0.3"
base64 = "0.22"
keyring = { version = "3" }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio-stream = "0.1"
tokio-test = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
fastrand = "2"
toml = "1.1.0"

[package]
name = "go-on"
version = "1.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "go_on"
path = "src/lib.rs"

[features]
# ── Build profiles (MUTUALLY EXCLUSIVE) ──────────────────────────────────────
# Exactly ONE profile must be selected. Default is profile-local.
#
# profile-local: single-user local tool; SQLite cache + adaptive vector store
#                Core sub-buses: tool, orchestration, observability, optimization
#                Fast startup, minimal external dependencies
#
# profile-simple-server: single-server deployment; SQLite cache + required sqlite-vec
#                        All sub-buses except distributed-memory
#                        Full capability bus for production readiness
#
# profile-multi-users-server: multi-user production; PostgreSQL cache + pgvector
#                             All sub-buses, including distributed-memory
#
# Compile-time validation in src/lib.rs via compile_error!() assertions.
# Enforces:
#   1. Exactly one profile must be selected (fail if zero or >1).
#   2. backend-sqlite and backend-postgres cannot both be enabled.
#
# Build examples:
#   cargo build                                                    # uses default profile-local
#   cargo build --no-default-features --features profile-local
#   cargo build --no-default-features --features profile-simple-server
#   cargo build --no-default-features --features profile-multi-users-server
default = ["profile-local"]

# Sub-bus feature gates (profile-conditional compilation)
sub-bus-tool = []
sub-bus-observability = []
sub-bus-optimization = []
sub-bus-memory = []
sub-bus-protocol = []
sub-bus-orchestration = []
sub-bus-distributed-memory = []
sub-bus-tool-future = []
sub-bus-voter-future = []

# Multimodal document-parsing backends (optional, feature-gated)
document-pdf = ["dep:lopdf"]
document-docx = ["dep:docx-rs"]
document-html = ["dep:scraper"]
document-markdown = ["dep:comrak"]
sub-bus-multimodal = [
    "document-pdf",
    "document-docx",
    "document-html",
    "document-markdown",
]

# Audio processing backends (optional, feature-gated)
audio-whisper-openai = []
audio-vosk = []

# Profile definitions (mutually exclusive via compile-time assertions)
#
# NOTE (Q5): profile-local and profile-simple-server currently have IDENTICAL
# feature sets. They are kept distinct for semantic clarity:
#   - profile-local:       single-user local tool (default for `cargo build`)
#   - profile-simple-server: single-server deployment (explicit --features)
# Their feature lists are expected to diverge as deployment-specific
# capabilities (telemetry exporters, cluster-aware caches, etc.) are added.
profile-local = [
    "backend-sqlite",
    "sub-bus-tool",
    "sub-bus-orchestration",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-protocol",
    "sync-secrets",
]
profile-simple-server = [
    "backend-sqlite",
    "sub-bus-tool",
    "sub-bus-orchestration",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-protocol",
    "sync-secrets",
]
profile-multi-users-server = [
    "backend-postgres",
    "sub-bus-tool",
    "sub-bus-tool-future",
    "sub-bus-voter-future",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-protocol",
    "sub-bus-orchestration",
    "sub-bus-distributed-memory",
    "sync-secrets",
]

# Full-feature profile for local development and CI testing
# Includes EVERY feature for maximum coverage
profile-full = [
    "backend-sqlite",
    "sub-bus-tool",
    "sub-bus-tool-future",
    "sub-bus-voter-future",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-protocol",
    "sub-bus-orchestration",
    "sub-bus-multimodal",
    "audio-whisper-openai",
    "audio-vosk",
    "vault",
    "temp_env",
    "sync-secrets",
]

# Backend implementations
backend-sqlite = ["dep:rusqlite", "dep:sqlite-vec"]
backend-postgres = ["dep:postgres", "dep:pgvector"]

# Legacy aliases (kept for backward compatibility)
local-acp-sqlite = ["profile-local"]
server-mcp-postgres = ["profile-multi-users-server"]

# Feature gates for conditional compilation (used by source code)
vault = []
temp_env = []

# Sync boundary: keyring secrets I/O runs synchronously.  Future callers from
# async contexts should wrap `run_secret_command()` in `spawn_blocking`.
sync-secrets = []

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
regex = "1"
indexmap = "2"
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["http2", "blocking", "multipart"] }
anyhow.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures-util.workspace = true
async-trait = "0.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry-stdout = "0.31"
rusqlite = { version = "0.31.0", features = ["bundled"], optional = true }
sha2 = "0.10"
uuid.workspace = true
toml.workspace = true
keyring.workspace = true
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "grpc-tonic"] }
glob = "0.3"
tempfile.workspace = true
base64.workspace = true
ordered-float = "5"
postgres = { version = "0.19", optional = true }
pgvector = { version = "0.4", features = ["postgres"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }
flate2 = "1"
fastrand = "2"
subtle = "2"
# C7: notify is available on all platforms; macos_kqueue feature is macOS-only.
notify = "6"

# ── Security / Signing / mTLS (GAP-B52) ────────────────────────────────────
ed25519-dalek = { version = "2", default-features = false, features = ["signature"] }
hmac = "0.12"
rand = "0.8"
hex = "0.4"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
x509-parser = { version = "0.17", default-features = false, features = ["verify"] }

# ── Multimodal document parsing (optional) ──────────────────────────────────
lopdf = { version = "0.34", optional = true }
docx-rs = { version = "0.4", optional = true }
scraper = { version = "0.20", optional = true }
comrak = { version = "0.30", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "6", features = ["macos_kqueue"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
# ── Note: Contract tests live in tests/contract_tests/ ──────────────────
tempfile.workspace = true
fs2 = "0.4"
serial_test = "3"
temp-env = "0.3"

# ── Optimisation profiles ──────────────────────────────────────────────────
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

[profile.test]
# No LTO — avoids linker errors with LLVM hidden symbols under opt-level=1
opt-level = 1
lto = "off"
