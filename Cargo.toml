[workspace]
members = [".", "gui", "sdk/rust", "test_i18n", "crates/mermaid-render", "crates/go-on-web-search", "crates/go-on-latex"]
resolver = "2"

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "process", "fs", "net", "io-util", "time", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "stream", "rustls-tls"] }
anyhow = "1"
thiserror = "2"
futures = "0.3"
futures-util = "0.3"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tokio-stream = "0.1"
tokio-test = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
tempfile = "3"
fastrand = "2"
toml = "1.1.0"

[package]
name = "go-on"
version = "1.4.0"
edition = "2021"
license = "MIT"

[lib]
name = "go_on"
path = "src/lib.rs"

[features]
# ── Build profiles (MUTUALLY EXCLUSIVE) ──────────────────────────────────────
# Exactly ONE profile must be selected. Default is local.
#
# local: single-user local tool; SQLite cache + adaptive vector store
#                Core sub-buses: tool, orchestration, observability, optimization
#                Fast startup, minimal external dependencies
#
# simple-server: single-server deployment; SQLite cache + required sqlite-vec
#                        All sub-buses except distributed-memory
#                        Full capability bus for production readiness
#
# multi-users-server: multi-user production; PostgreSQL cache + pgvector
#                             All sub-buses, including distributed-memory
#
# Compile-time validation in src/lib.rs via compile_error!() assertions.
# Enforces:
#   1. Exactly one profile must be selected (fail if zero or >1).
#   2. backend-sqlite and backend-postgres cannot both be enabled.
#
# Build examples:
#   cargo build                                                    # uses default local
#   cargo build --no-default-features --features local
#   cargo build --no-default-features --features simple-server
#   cargo build --no-default-features --features multi-users-server
default = ["local"]

# Sub-bus feature gates (profile-conditional compilation)
sub-bus-tool = []
sub-bus-observability = []
sub-bus-optimization = []
sub-bus-memory = []
sub-bus-protocol = []
sub-bus-orchestration = []
sub-bus-distributed-memory = []
# Note: sub-bus-tool-future was removed because no code ever used it.
sub-bus-voter-future = []

# Multimodal document-parsing backends (optional, feature-gated)
document-pdf = ["dep:lopdf"]
document-docx = ["dep:docx-rs"]
document-html = ["dep:scraper"]
document-markdown = ["dep:comrak"]
document-excel = ["dep:calamine"]
document-ppt = ["dep:quick-xml"]
document-excel-write = ["dep:rust_xlsxwriter"]
sub-bus-multimodal = [
    "document-pdf",
    "document-docx",
    "document-html",
    "document-markdown",
    "document-excel",
    "document-ppt",
]

# Data utilities (optional, feature-gated)
data-export = ["dep:csv", "dep:serde_yaml"]

# Barcode / 2D code generation tools (optional, feature-gated)
barcode-tools = []

# Audio processing backends (optional, feature-gated)
audio-whisper-openai = []
audio-vosk = []

# Image processing tools (optional, feature-gated)
image-processing = ["dep:image", "dep:serde_yaml"]

# CAD and drawing tools (optional, feature-gated)
cad-dxf = ["dep:dxf"]
cad-stl = []
cad-utils = []
cad-obj = []
cad-step = []
cad-geo = []
cad-gltf = []
cad-iges = []
cad-ply = []
# CAM / GIS tools (feature-gated, no new dependencies needed)
cam-gcode = []
gis-gpx = []
drawing-svg = ["dep:svg"]
# 3D model processing (optional, feature-gated)
model-3d = ["dep:stl"]

# Additional 3D formats
model-3d-extra = ["dep:tobj"]

# Profile definitions (mutually exclusive via compile-time assertions)
#
# local:       single-user local tool (default for `cargo build`)
#                      Core sub-buses for local operation.
# simple-server: single-server deployment (explicit --features)
#                        Adds sub-bus-distributed-memory and vault
#                        on top of local to support production server needs.
local = [
    "backend-sqlite",
    "sub-bus-tool",
    "sub-bus-orchestration",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-protocol",
]
simple-server = [
    "backend-sqlite",
    "sub-bus-tool",
    "sub-bus-orchestration",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-distributed-memory",
    "sub-bus-protocol",
    "vault",
]
multi-users-server = [
    "backend-postgres",
    "sub-bus-tool",
    "sub-bus-voter-future",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-memory",
    "sub-bus-protocol",
    "sub-bus-orchestration",
    "sub-bus-distributed-memory",
    "vault",
]

# Office / Document / Data tools
# (charting, data-collection, image-extra — reserved for future use, not yet implemented)

# Full-feature profile for local development and CI testing
# Includes EVERY feature for maximum coverage
full = [
    "backend-sqlite",
    "sub-bus-tool",
    "sub-bus-voter-future",
    "sub-bus-memory",
    "sub-bus-observability",
    "sub-bus-optimization",
    "sub-bus-protocol",
    "sub-bus-orchestration",
    "sub-bus-distributed-memory",
    "sub-bus-multimodal",
    "document-excel-write",
    "audio-whisper-openai",
    "audio-vosk",
    "data-export",
    "image-processing",
    "cad-dxf",
    "cad-stl",
    "cad-utils",
    "cad-obj",
    "cad-step",
    "cad-geo",
    "cad-gltf",
    "cad-iges",
    "cad-ply",
    "drawing-svg",
    "model-3d",
    "model-3d-extra",
    "document-email",
    "document-invoice",
    "barcode-tools",
    "cam-gcode",
    "gis-gpx",
    "vault",
    # (charting, data-collection, image-extra — reserved, not yet implemented)
    "game-online",
    "game-process",
    "game-screen",
    "game-input",
    "game-agent",
    "game-state",
    "game-modding",
]

# Backend implementations
backend-sqlite = ["dep:rusqlite", "dep:sqlite-vec"]
backend-postgres = ["dep:postgres", "dep:pgvector"]



# Feature gates for conditional compilation (used by source code)
vault = []
document-email = []
document-invoice = []

# ── Game tools (optional, feature-gated) ─────────────────────────
game-online = []
game-process = []
game-screen = []
game-input = []
game-agent = []
game-state = []
game-modding = []
# Chaos engineering fault injection (opt-in, not in any profile by default)
chaos-testing = []

# Sync boundary: keyring secrets I/O runs synchronously.  Future callers from
# async contexts should wrap `run_secret_command()` in `spawn_blocking`.


[dependencies]
tokio.workspace = true
tokio-util.workspace = true
regex = "1"
indexmap = "2"
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["http2", "blocking", "multipart"] }
anyhow.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive", "env"] }
futures-util.workspace = true
async-trait = "0.1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry-stdout = "0.32"
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }
sha2 = "0.11"
uuid.workspace = true
toml.workspace = true
url = { version = "2", features = ["serde"] }
keyring.workspace = true
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic"] }
glob = "0.3"
tempfile.workspace = true
base64.workspace = true
ordered-float = "5"
postgres = { version = "0.19", optional = true }
pgvector = { version = "0.4", features = ["postgres"], optional = true }
sqlite-vec = { version = "0.1.9", optional = true }
flate2 = "1"
fastrand = "2"
subtle = "2"
# C7: notify is available on all platforms; macos_kqueue feature is macOS-only.
notify = "8"

# ── Security / Signing / mTLS (GAP-B52) ────────────────────────────────────
ed25519-dalek = { version = "2", default-features = false, features = ["signature", "rand_core"] }
hmac = "0.13"
rand = "0.10"
hex = "0.4"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
x509-parser = { version = "0.18", default-features = false, features = ["verify"] }

# ── Data export ──────────────────────────────────────────────────────────
csv = { version = "1.3", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
serde_yaml = { version = "0.9", optional = true }

# ── CAD / Drawing / Document tools (optional) ──────────────────────────
dxf = { version = "0.6", optional = true }
svg = { version = "0.18", optional = true }
stl = { version = "0.2", optional = true }
tobj = { version = "4", optional = true }

# ── Multimodal document parsing (optional) ──────────────────────────────────
lopdf = { version = "0.41", optional = true }
docx-rs = { version = "0.4", optional = true }
scraper = { version = "0.27", optional = true }
comrak = { version = "0.52", optional = true }
calamine = { version = "0.26", optional = true }
rust_xlsxwriter = { version = "0.82", optional = true }
quick-xml = { version = "0.37", features = ["serialize"], optional = true }

zip = "2"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
go-on-web-search = { path = "crates/go-on-web-search" }

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8", features = ["macos_kqueue"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
# ── Note: Contract tests live in tests/contract_tests/ ──────────────────
serial_test = "3"
temp-env = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

# ── Optimisation profiles ──────────────────────────────────────────────────
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

[profile.test]
# Fast compilation — no LTO, opt-level=0 for minimum compile time.
# Tests are relatively short-lived so optimization overhead doesn't pay off.
opt-level = 0
lto = "off"

[profile.bench]
# Benchmarks benefit from full optimization for accurate measurements.
opt-level = 3
lto = "fat"
codegen-units = 1
