[package]
name = "go-on"
version = "0.1.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
anyhow = "1"
thiserror = "2.0.18"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
async-trait = "0.1"
toml = "1.1.0"
env = "1.0"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.39.0", features = ["bundled"] }
sha2 = "0.11.0"
keyring = "3"

[dev-dependencies]
tempfile = "3"

