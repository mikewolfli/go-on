[project]
name = "go-on-sdk"
version = "1.5.2"
description = "Python SDK for go-on (ACP/MCP agent orchestration runtime) — 7 feature-gated sub-bus architecture"
license = "MIT"
authors = [{ name = "go-on contributors" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
minversion = "7"

[tool.pyright]
include = ["go_on_sdk"]
# JSON-RPC client inherently deals with dynamic/Any types from server responses.
# Disable strict typing warnings that are impractical for API client code.
reportExplicitAny = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201"]  # allow print in examples
"__init__.py" = ["D100"]  # allow missing module docstring in __init__

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
