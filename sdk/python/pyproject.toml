[project]
name = "go-on-sdk"
version = "0.8.2"
description = "Python SDK for go-on (ACP/MCP agent orchestration runtime) — Phase 4, 14-bus architecture"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
