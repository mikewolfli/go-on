[package]
name = "go_on_sdk"
version = "0.9.1"
edition = "2021"
license = "MIT"

description = "Rust SDK for go-on (ACP/MCP agent orchestration runtime) — Phase 4, 14-bus architecture"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
