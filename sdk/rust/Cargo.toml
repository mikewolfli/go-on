[package]
name = "go_on_sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

description = "Rust SDK stub for go-on ACP endpoints"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
