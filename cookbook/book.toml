[book]
title = "go-on Documentation — AI Agent Orchestration System"
authors = ["go-on Team"]
language = "en"
src = "src"
description = "Complete documentation for go-on: ACP/MCP agent orchestration runtime with 37 AI providers, 13-sub-bus architecture, autonomous agent loops, DAG tool orchestration, governance (RBAC/audit), and observability"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mikewolfli/go-on"
site-url = "/"
edit-url-template = "https://github.com/mikewolfli/go-on/edit/main/cookbook/src/{path}"

[preprocessor.links]
renderers = ["html"]

[preprocessor.index]
renderers = ["html"]
