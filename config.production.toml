# ============================================================
# TEMPLATE FILE — DO NOT COMMIT SECRETS
# This file is a configuration template for production use.
# The value of GO_ON_ENTRY_API_KEY must be set as an
# environment variable and must NEVER be stored in this file
# or committed to version control.
# For local overrides, create config.local.toml (gitignored).
# ============================================================

default_phase = "coding"
model_selection_mode = "adaptive"

[agents]

[agents.deepseek]
type = "deepseek"
api_key_env = "keyring://go-on/deepseek_api_key"
model = "deepseek-chat"
supports_system = true

[flow]
name = "Production Adaptive"
phases = ["planning", "coding", "review", "delivery"]

[phases.planning]
description = "Planning phase"
agents = ["deepseek"]
fallback = true

[phases.coding]
description = "Coding phase"
agents = ["deepseek"]
fallback = true

[phases.coding.options]
autopilot_complexity = "auto"
request_timeout_seconds = 150
review_timeout_seconds = 60
cache_enabled = true
vector_enabled = true
summary_enabled = true
full_auto_review_agents = ["deepseek"]
phase_max_inflight = 24
global_max_inflight = 128

[phases.review]
description = "Review phase"
agents = ["deepseek"]
fallback = true

[phases.review.options]
request_timeout_seconds = 60
review_timeout_policy = "reject"
review_min_response_chars = 12
phase_max_inflight = 16
global_max_inflight = 128

[phases.delivery]
description = "Delivery phase"
agents = ["deepseek"]
fallback = false

[phases.delivery.options]
request_timeout_seconds = 90

[protocol]
mode = "acp_http"

[runtime]
maintenance_interval_seconds = 60
health_interval_seconds = 120
shutdown_drain_seconds = 45
sqlite_vacuum_interval_cycles = 60
acp_http_bind_addr = "127.0.0.1:8090"
entry_auth_enabled = true
entry_auth_api_key_env = "GO_ON_ENTRY_API_KEY"
entry_rate_limit_rpm = 240
entry_rate_limit_burst = 60
production_strict = true
otel_enabled = true
otel_exporter = "otlp"
otel_service_name = "go-on"
otel_sample_ratio = 1.0
trace_slow_top_n = 20
# Skills extension: set to true to enable builtin skills (e.g. builtin.echo).
# Keep false in production to minimize the exposed tool surface.
skills_enabled = false
# Imported skills are disabled by default in production.
skills_import_enabled = false
# Allowlist is explicit: keep empty unless approved sources are reviewed.
skills_allowed_sources = []
skills_require_sha256 = true
skills_allow_floating_ref = false
skills_cache_dir = "skills_cache"

[cache]
enabled = true
path = "acp_cache.sqlite3"
default_ttl_seconds = 3600
max_entries = 5000

[vector]
enabled = true
auto_mode = true
path = "acp_vector.sqlite3"
dimensions = 192
min_query_chars = 80
top_k = 2
min_similarity = 0.82
max_snippet_chars = 800
max_entries = 10000
summary_enabled = true
summary_trigger_messages = 8
summary_max_chars = 1200

# NOTE:
# 1) Keep backend bound to loopback and expose only through TLS ingress.
# 2) Ensure GO_ON_ENTRY_API_KEY is present in process environment before startup.
# 3) Never store secret key values in this file — use the environment variable only.
