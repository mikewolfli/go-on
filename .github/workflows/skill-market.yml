# Skill Marketplace CI — Validate, index, and publish community skills.
#
# This workflow runs when skills/ directory content changes (the canonical
# go-on skill repository layout) or when the marketplace index is manually
# triggered. It validates every SKILL.md, checks version compatibility,
# builds the consolidated goon-skill-index.yaml, and optionally publishes
# to GitHub Pages.
#
# Repository layout expected by this workflow:
#
#   skills/
#     <skill-name>/
#       SKILL.md          # Required: skill manifest
#       icon.png           # Optional: skill icon
#       tests/             # Optional: smoke tests
#
#   goon-skill-index.yaml # Auto-generated by this workflow

name: Skill Marketplace (validate + index)

on:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "Publish updated index to GitHub Pages"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "goon-skill-index.yaml"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "goon-skill-index.yaml"

# Grant GITHUB_TOKEN write access for publishing
permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  SKILLS_DIR: skills
  INDEX_FILE: goon-skill-index.yaml

jobs:
  # ── Job 1: Validate every skill in the repository ──────────────────
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    outputs:
      valid_count: ${{ steps.validate.outputs.valid }}
      total_count: ${{ steps.check-dir.outputs.count }}
      index_json: ${{ steps.build-index.outputs.index }}
    steps:
      - uses: actions/checkout@v4

      - name: Check skills directory exists
        id: check-dir
        run: |
          if [ -d "${{ env.SKILLS_DIR }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "count=$(ls -d ${{ env.SKILLS_DIR }}/*/ 2>/dev/null | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ── Validate each SKILL.md ──────────────────────────────────
      - name: Validate SKILL.md manifests
        id: validate
        if: steps.check-dir.outputs.exists == 'true' && steps.check-dir.outputs.count > '0'
        shell: bash
        run: |
          errors=0
          valid=0
          for skill_dir in ${{ env.SKILLS_DIR }}/*/; do
            skill_name="$(basename "$skill_dir")"
            manifest="$skill_dir/SKILL.md"

            if [ ! -f "$manifest" ]; then
              echo "::error ::Missing SKILL.md in $skill_dir"
              errors=$((errors + 1))
              continue
            fi

            # Extract frontmatter via awk (between --- markers)
            name_line=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^name:' | head -1)
            desc_line=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^description:' | head -1)
            ver_line=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^version:' | head -1)

            if [ -z "$name_line" ]; then
              echo "::error $manifest::Missing 'name' in SKILL.md frontmatter"
              errors=$((errors + 1))
              continue
            fi

            name=$(echo "$name_line" | sed 's/^name:\s*//')
            if [ ${#name} -gt 64 ]; then
              echo "::error $manifest::Skill name '$name' exceeds 64 characters"
              errors=$((errors + 1))
            fi

            description=$(echo "$desc_line" | sed 's/^description:\s*//')
            if [ -z "$description" ]; then
              echo "::warning $manifest::Skill '$name' has no description"
            fi

            version=$(echo "$ver_line" | sed 's/^version:\s*//')
            if [ -z "$version" ]; then
              echo "::warning $manifest::Skill '$name' has no version, defaulting to 0.1.0"
            fi

            echo "✅ $skill_name (v${version:-0.1.0})"
            valid=$((valid + 1))
          done

          echo "valid=$valid" >> $GITHUB_OUTPUT
          echo "errors=$errors" >> $GITHUB_OUTPUT

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

      - name: No skills to validate
        if: steps.check-dir.outputs.exists != 'true' || steps.check-dir.outputs.count == '0'
        run: echo "No skills directory found — skipping validation"

      # ── Build goon-skill-index.yaml ────────────────────────────
      - name: Build consolidated index
        id: build-index
        if: steps.check-dir.outputs.exists == 'true' && steps.check-dir.outputs.count > '0'
        shell: bash
        run: |
          cat > "${{ env.INDEX_FILE }}" << 'YAML_HEADER'
          # goon-skill-index.yaml
          # Auto-generated by Skill Marketplace CI — do not edit manually.
          schema_version: "1.0"
          updated_at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          maintainers:
            - github: "${{ github.repository_owner }}"
          skills:
          YAML_HEADER

          for skill_dir in ${{ env.SKILLS_DIR }}/*/; do
            skill_name="$(basename "$skill_dir")"
            manifest="$skill_dir/SKILL.md"

            if [ ! -f "$manifest" ]; then
              continue
            fi

            # Extract frontmatter fields
            name=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^name:' | sed 's/^name:\s*//')
            description=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^description:' | sed 's/^description:\s*//')
            version=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^version:' | sed 's/^version:\s*//')
            author=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^author:' | sed 's/^author:\s*//')
            tags=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^tags:' | sed 's/^tags:\s*//')
            min_version=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^min_go_on_version:' | sed 's/^min_go_on_version:\s*//')

            cat >> "${{ env.INDEX_FILE }}" << YAML_ENTRY
            - name: "${name:-$skill_name}"
              description: "${description:-}"
              author: "${author:-${{ github.repository_owner }}}"
              repository: "github.com/${{ github.repository }}"
              path: "${{ env.SKILLS_DIR }}/$skill_name"
              version: "${version:-0.1.0}"
              min_go_on_version: "${min_version:-1.0.0}"
              tags: [${tags:-}]
              verified: false
              rating: 0.0
              install_count: 0
          YAML_ENTRY
          done

          echo "Index written to ${{ env.INDEX_FILE }}"
          echo "---"
          cat "${{ env.INDEX_FILE }}"

      # ── Verify index parses as valid YAML ──────────────────────
      - name: Validate index YAML
        if: steps.check-dir.outputs.exists == 'true' && steps.check-dir.outputs.count > '0'
        run: |
          echo "Index file generated with $(grep -c 'name:' ${{ env.INDEX_FILE }}) entries"
          head -20 ${{ env.INDEX_FILE }}

  # ── Job 2: Smoke test with go-on binary ─────────────────────────
  smoke-test:
    name: Smoke test go-on skill import
    needs: validate
    if: needs.validate.outputs.valid_count > '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build go-on (local profile)
        run: cargo build --locked --no-default-features -F local

      - name: Create SQLite databases
        run: |
          mkdir -p config/sqlite3
          touch config/sqlite3/acp_cache.sqlite3
          touch config/sqlite3/acp_vector.sqlite3

      - name: Validate skill manifests
        shell: bash
        run: |
          # Real validation: every skill directory must ship a SKILL.md with
          # YAML frontmatter (---) and a description field. Fails the job on
          # any violation instead of always exiting 0.
          failed=0
          for skill_dir in ${{ env.SKILLS_DIR }}/*/; do
            [ -d "$skill_dir" ] || continue
            manifest="$skill_dir/SKILL.md"
            skill_name="$(basename "$skill_dir")"
            if [ ! -f "$manifest" ]; then
              echo "  ❌ $skill_name: missing SKILL.md"
              failed=1
              continue
            fi
            if head -1 "$manifest" | grep -q "^---" \
              && grep -q "^description:" "$manifest" \
              && grep -q "^name:" "$manifest"; then
              echo "  ✅ $skill_name: manifest valid"
            else
              echo "  ❌ $skill_name: SKILL.md missing required frontmatter (--- / name: / description:)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Skill manifest validation failed."
            exit 1
          fi
          echo "All skill manifests valid."

  # ── Job 3: Publish index to GitHub Pages (manual only) ─────────
  publish:
    name: Publish index to GitHub Pages
    needs: validate
    if: |
      github.event_name == 'workflow_dispatch'
      && inputs.publish_pages == 'true'
      && needs.validate.outputs.valid_count > '0'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build index
        id: build-index
        shell: bash
        run: |
          # Re-build index (same logic as validate job)
          cat > "${{ env.INDEX_FILE }}" << 'YAML_HEADER'
          # goon-skill-index.yaml
          # Auto-generated by Skill Marketplace CI
          schema_version: "1.0"
          updated_at: "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          maintainers:
            - github: "${{ github.repository_owner }}"
          skills:
          YAML_HEADER

          for skill_dir in ${{ env.SKILLS_DIR }}/*/; do
            [ -d "$skill_dir" ] || continue
            manifest="$skill_dir/SKILL.md"
            [ -f "$manifest" ] || continue
            skill_name="$(basename "$skill_dir")"

            name=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^name:' | sed 's/^name:\s*//')
            description=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^description:' | sed 's/^description:\s*//')
            version=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^version:' | sed 's/^version:\s*//')
            author=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^author:' | sed 's/^author:\s*//')
            tags=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^tags:' | sed 's/^tags:\s*//')
            min_version=$(awk '/^---$/{flag=1; next} flag{print; if(/^---$/) exit}' "$manifest" | grep -E '^min_go_on_version:' | sed 's/^min_go_on_version:\s*//')

            cat >> "${{ env.INDEX_FILE }}" << YAML_ENTRY
            - name: "${name:-$skill_name}"
              description: "${description:-}"
              author: "${author:-${{ github.repository_owner }}}"
              repository: "github.com/${{ github.repository }}"
              path: "${{ env.SKILLS_DIR }}/$skill_name"
              version: "${version:-0.1.0}"
              min_go_on_version: "${min_version:-1.0.0}"
              tags: [${tags:-}]
              verified: false
              rating: 0.0
              install_count: 0
          YAML_ENTRY
          done

          echo "✅ Index built with $(grep -c 'name:' ${{ env.INDEX_FILE }}) entries"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp "${{ env.INDEX_FILE }}" _site/
          # Generate a simple HTML landing page
          cat > _site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Go-On Skill Marketplace</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 800px; margin: 0 auto; padding: 2em; }
              h1 { color: #333; }
              pre { background: #f5f5f5; padding: 1em; border-radius: 4px; overflow-x: auto; }
              a { color: #0366d6; }
            </style>
          </head>
          <body>
            <h1>🧩 Go-On Skill Marketplace</h1>
            <p>Community-contributed skills for the Go-On AGI platform.</p>
            <p>Index: <a href="goon-skill-index.yaml">goon-skill-index.yaml</a></p>
            <p>To install a skill, use:</p>
            <pre>go-on skill import &lt;skill-name&gt;</pre>
            <hr>
            <p><em>Last updated: $(date -u)</em></p>
          </body>
          </html>
          HTML
          echo "✅ Static site ready"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 4: PR comment with validation summary ──────────────────
  pr-comment:
    name: PR validation summary
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment validation result
        uses: actions/github-script@v7
        with:
          script: |
            const valid = parseInt('${{ needs.validate.outputs.valid_count || 0 }}');
            const total = parseInt('${{ needs.validate.outputs.total_count || 0 }}');
            const indexExists = '${{ needs.validate.outputs.index_json }}' !== '';

            let body = '## 🧩 Skill Marketplace Validation\n\n';
            if (total > 0) {
              const failed = total - valid;
              body += `- ✅ **${valid}/${total}** skills valid\n`;
              if (failed > 0) {
                body += `- ❌ **${failed}** skill(s) have errors — check the workflow log\n`;
              }
            } else {
              body += '- ℹ️ No skills found in this PR\n';
            }
            body += `- 📄 Index ${indexExists ? '✅ generated' : '⚠️ not generated'}\n`;
            body += '\n---\n*Automated by Skill Marketplace CI*';

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body?.includes('Skill Marketplace Validation')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
