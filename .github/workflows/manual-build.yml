name: Manual Build Backend and GUI

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Build Backend and GUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Backend
        run: cargo build --release

      - name: Verify Backend Binary
        run: test -f target/release/go-on

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-on-backend
          path: target/release/go-on

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install GUI dependencies
        working-directory: ./GUI
        run: npm install

      - name: Build GUI (Vite)
        working-directory: ./GUI
        run: npm run build

      - name: Build GUI (Tauri)
        working-directory: ./GUI
        run: npm run tauri build

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-on-gui
          path: GUI/src-tauri/target/release/
