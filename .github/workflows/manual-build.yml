name: Manual Build Backend and GUI

on:
  workflow_dispatch:

jobs:
  build-all:
    name: Build Backend (3 profiles) + GUI + VS Code
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # ── Build & verify all 3 profiles ──────────────────────────────────
      - name: Build profile-local
        run: cargo build --release

      - name: Verify profile-local binary
        run: test -f target/release/go-on

      - name: Build profile-simple-server
        run: cargo build --release --no-default-features -F profile-simple-server

      - name: Build profile-multi-users-server
        run: cargo build --release --no-default-features -F profile-multi-users-server

      # ── Clippy all 3 profiles ──────────────────────────────────────────
      - name: Clippy (profile-local)
        run: cargo clippy -F profile-local -- -D warnings

      - name: Clippy (profile-simple-server)
        run: cargo clippy --no-default-features -F profile-simple-server -- -D warnings

      - name: Clippy (profile-multi-users-server)
        run: cargo clippy --no-default-features -F profile-multi-users-server -- -D warnings

      # ── Tests ──────────────────────────────────────────────────────────
      - name: Unit + integration tests (profile-local)
        run: cargo test -F profile-local

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-on-backend-${{ matrix.os }}
          path: target/release/go-on

      # ── GUI ────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install GUI dependencies
        working-directory: ./GUI
        run: npm install

      - name: Test GUI contract gate
        working-directory: ./GUI
        run: npm test

      - name: Build GUI (Vite)
        working-directory: ./GUI
        run: npm run build

      - name: Build GUI (Tauri)
        working-directory: ./GUI
        run: npm run tauri build

      # ── VS Code addon ──────────────────────────────────────────────────
      - name: Install VS Code addon dependencies
        working-directory: ./vscode-addon
        run: npm install

      - name: Build VS Code addon
        working-directory: ./vscode-addon
        run: npm run compile

      - name: Test VS Code addon contract gate
        working-directory: ./vscode-addon
        run: npm test

      - name: Upload GUI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-on-gui-${{ matrix.os }}
          path: GUI/src-tauri/target/release/
