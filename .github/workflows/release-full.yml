name: Release Full (3-platform package)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "0.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-package-and-upload:
    name: Build + package + upload
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            backend_bin: go-on
            gui_bin: go-on-gui-egui
            archive_ext: tar.gz
            profile_features: profile-local,backend-sqlite
          - os: ubuntu-latest
            platform: linux-x64-multi-users
            backend_bin: go-on
            gui_bin: go-on-gui-egui
            archive_ext: tar.gz
            profile_features: profile-multi-users-server,backend-postgres
          - os: ubuntu-latest
            platform: linux-x64-simple-server
            backend_bin: go-on
            gui_bin: go-on-gui-egui
            archive_ext: tar.gz
            profile_features: profile-simple-server,backend-sqlite
          - os: macos-latest
            platform: macos-arm64
            backend_bin: go-on
            gui_bin: go-on-gui-egui
            archive_ext: tar.gz
            profile_features: profile-local,backend-sqlite
          - os: windows-latest
            platform: windows-x64
            backend_bin: go-on.exe
            gui_bin: go-on-gui-egui.exe
            archive_ext: zip
            profile_features: profile-local,backend-sqlite
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-composite0-dev \
            libxcb-xfixes0-dev \
            libxcb-xkb-dev \
            libxcb-shape0-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libvulkan-dev

      - name: Rust cache (backend)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "go-on-backend-release"

      - name: Rust cache (GUI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui -> gui/target"
          shared-key: "go-on-gui-release"

      - name: Create SQLite databases
        shell: bash
        run: |
          mkdir -p config
          touch config/acp_cache.sqlite3
          touch config/acp_vector.sqlite3

      # ── Build backend (all profiles) ────────────────────────
      - name: Build backend (release, ${{ matrix.profile_features }})
        run: cargo build --release --locked --no-default-features -F "${{ matrix.profile_features }}"

      - name: Build EGUI GUI (release, locked)
        run: cargo build --release --locked --manifest-path gui/Cargo.toml

      # ── VS Code addon ──────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-addon/package-lock.json

      - name: Build VS Code addon
        shell: bash
        run: |
          cd vscode-addon
          npm ci
          npm run compile
          npx vsce package --out go-on-vscode.vsix

      - name: Package
        shell: bash
        run: |
          PKG="dist/go-on-${{ matrix.platform }}"
          mkdir -p "$PKG/backend"
          cp "target/release/${{ matrix.backend_bin }}" "$PKG/backend/"
          cp "gui/target/release/${{ matrix.gui_bin }}" "$PKG/"
          cp "gui/icon.ico" "$PKG/"
          cp -r RULES "$PKG/backend/rules"
          cp -r languages "$PKG/backend/"
          cp -r prompts "$PKG/"
          cp -r prompts "$PKG/backend/prompts"
          cp config/config.toml "$PKG/backend/"
          cp config/zed-config.toml "$PKG/backend/"
          # Include VS Code addon (platform-independent, same .vsix for all)
          cp vscode-addon/go-on-vscode.vsix "$PKG/"
          cp contracts/editor-capability-matrix.json "$PKG/"
          mkdir -p dist/out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd dist && 7z a -tzip "out/go-on-${{ matrix.platform }}.zip" "go-on-${{ matrix.platform }}" && cd ..
          else
            tar -C dist -czf "dist/out/go-on-${{ matrix.platform }}.tar.gz" "go-on-${{ matrix.platform }}"
          fi

      - name: Upload release package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/out/go-on-${{ matrix.platform }}.${{ matrix.archive_ext }}
            vscode-addon/go-on-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
