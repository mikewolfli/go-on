name: Release Backend and GUI

on:
  release:
    types: [published]

jobs:
  build-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # ── Backend: build release binary ─────────────────────────────────
      # Checks (clippy, tests) are already run by build.yml on every push/PR.
      - name: Build backend (release, profile-local)
        run: cargo build --release --locked

      # ── GUI ────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build GUI
        working-directory: ./GUI
        run: |
          npm ci
          npm run build
          npm run tauri build

      # ── VS Code addon ──────────────────────────────────────────────────
      - name: Build VS Code addon and package vsix
        working-directory: ./vscode-addon
        run: |
          npm ci
          npm run compile
          npm test
          npx @vscode/vsce package --no-dependencies --out go-on-vscode.vsix

      # ── Package ────────────────────────────────────────────────────────
      - name: Prepare release package
        shell: bash
        run: |
          PKG="go-on-release-${{ matrix.os }}"

          mkdir -p "$PKG"

          # GUI binary (platform-specific)
          GUI_BIN=$(find GUI/src-tauri/target/release/bundle -type f \( -name "go-on-gui" -o -name "go-on-gui.exe" -o -name "*.AppImage" -o -name "*.dmg" \) 2>/dev/null | head -1 || true)
          if [ -z "$GUI_BIN" ]; then
            GUI_BIN=$(find GUI/src-tauri/target/release -maxdepth 1 \( -name "go-on-gui" -o -name "go-on-gui.exe" \) 2>/dev/null | head -1 || true)
          fi
          [ -n "$GUI_BIN" ] && cp "$GUI_BIN" "$PKG/"

          # VS Code extension
          cp vscode-addon/go-on-vscode.vsix "$PKG/" 2>/dev/null || true

          # Backend
          mkdir -p "$PKG/backend"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/go-on.exe "$PKG/backend/" 2>/dev/null || true
          else
            cp target/release/go-on "$PKG/backend/" 2>/dev/null || true
          fi
          cp -r RULES                               "$PKG/backend/"  || true
          cp -r languages                           "$PKG/backend/"  || true
          cp config/config.toml                     "$PKG/backend/"  || true
          cp config/config.coding.toml              "$PKG/backend/"  || true
          cp config/config.simple-server.toml       "$PKG/backend/"  || true
          cp config/config.multi-users-server.toml  "$PKG/backend/"  || true
          cp config/providers.toml                  "$PKG/backend/"  || true
          cp README.md                              "$PKG/backend/"  || true
          cp README.zh-CN.md                        "$PKG/backend/"  || true
          cp scripts/start-go-on.sh                 "$PKG/backend/"  || true
          cp scripts/stop-go-on.sh                  "$PKG/backend/"  || true
          cp scripts/run-quality-gate.sh            "$PKG/backend/"  || true
          cp scripts/run-release-readiness-gate.sh   "$PKG/backend/"  || true

          # Archive
          tar -czf "${PKG}.tar.gz" "$PKG"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: go-on-release-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
