name: Release Backend and GUI

on:
  workflow_dispatch:
  push:
    tags:
      - "0.*"
      - "v0.*"
      - "[0-9]*"
  release:
    types: [published]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-package:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Create required SQLite databases for release build
        shell: bash
        run: |
          mkdir -p config
          touch config/acp_cache.sqlite3
          touch config/acp_vector.sqlite3

      - name: Install Tauri system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # ── Backend: build release binary ─────────────────────────────────
      # Checks (clippy, tests) are already run by build.yml on every push/PR.
      - name: Build backend (release, profile-local)
        run: cargo build --release --locked

      # ── GUI ────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            GUI/package-lock.json
            vscode-addon/package-lock.json

      - name: Build GUI (tauri build calls `npm run build` via beforeBuildCommand)
        working-directory: ./GUI
        run: |
          npm ci
          npm run tauri build

      - name: Embed backend into macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BUNDLE=$(find GUI/src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name "*.app" | head -1 || true)
          if [ -z "$APP_BUNDLE" ]; then
            echo "macOS app bundle not found"
            exit 1
          fi

          RUNTIME_DIR="$APP_BUNDLE/Contents/Resources/backend"
          mkdir -p "$RUNTIME_DIR"

          cp target/release/go-on "$RUNTIME_DIR/go-on"
          chmod +x "$RUNTIME_DIR/go-on"

          cp -r RULES "$RUNTIME_DIR/" || true
          cp -r languages "$RUNTIME_DIR/" || true
          cp config/config.toml "$RUNTIME_DIR/" || true
          cp config/config.coding.toml "$RUNTIME_DIR/" || true
          cp config/config.simple-server.toml "$RUNTIME_DIR/" || true
          cp config/config.multi-users-server.toml "$RUNTIME_DIR/" || true
          cp config/providers.toml "$RUNTIME_DIR/" || true
          cp README.md "$RUNTIME_DIR/" || true
          cp README.zh-CN.md "$RUNTIME_DIR/" || true

      # ── VS Code addon ──────────────────────────────────────────────────
      # compile is required to produce `out/` before vsce package; lint/check
      # already ran in build.yml — no redundant verification here.
      - name: Build VS Code addon and package vsix
        working-directory: ./vscode-addon
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies --out go-on-vscode.vsix

      # ── Package ────────────────────────────────────────────────────────
      - name: Prepare release package
        shell: bash
        run: |
          PKG="go-on-release-${{ matrix.os }}"

          mkdir -p "$PKG"
          GUI_APP=""

          # GUI artifacts (platform-specific)
          if [ "${{ runner.os }}" = "macOS" ]; then
            GUI_DMG=$(find GUI/src-tauri/target/release/bundle -type f -name "*.dmg" 2>/dev/null | head -1 || true)
            GUI_APP=$(find GUI/src-tauri/target/release/bundle -type d -name "*.app" 2>/dev/null | head -1 || true)
            [ -n "$GUI_DMG" ] && cp "$GUI_DMG" "$PKG/"
            [ -n "$GUI_APP" ] && cp -R "$GUI_APP" "$PKG/"
          else
            GUI_BIN=$(find GUI/src-tauri/target/release/bundle -type f \( -name "go-on-gui" -o -name "go-on-gui.exe" -o -name "*.AppImage" \) 2>/dev/null | head -1 || true)
            if [ -z "$GUI_BIN" ]; then
              GUI_BIN=$(find GUI/src-tauri/target/release -maxdepth 1 \( -name "go-on-gui" -o -name "go-on-gui.exe" \) 2>/dev/null | head -1 || true)
            fi
            [ -n "$GUI_BIN" ] && cp "$GUI_BIN" "$PKG/"
          fi

          # VS Code extension
          cp vscode-addon/go-on-vscode.vsix "$PKG/" 2>/dev/null || true
          cp scripts/macos-gui-unblock.sh "$PKG/" 2>/dev/null || true
          cp scripts/first-run.sh "$PKG/" 2>/dev/null || true
          cp MACOS_FIRST_RUN.md "$PKG/" 2>/dev/null || true

          # Standalone backend runtime (kept for CLI/VS Code addon linking)
          BACKEND_DIR="$PKG/backend"
          mkdir -p "$BACKEND_DIR"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/go-on.exe "$BACKEND_DIR/" 2>/dev/null || true
          else
            cp target/release/go-on "$BACKEND_DIR/" 2>/dev/null || true
          fi
          cp -r RULES                               "$BACKEND_DIR/"  || true
          cp -r languages                           "$BACKEND_DIR/"  || true
          cp config/config.toml                     "$BACKEND_DIR/"  || true
          cp config/config.coding.toml              "$BACKEND_DIR/"  || true
          cp config/config.simple-server.toml       "$BACKEND_DIR/"  || true
          cp config/config.multi-users-server.toml  "$BACKEND_DIR/"  || true
          cp config/providers.toml                  "$BACKEND_DIR/"  || true
          cp README.md                              "$BACKEND_DIR/"  || true
          cp README.zh-CN.md                        "$BACKEND_DIR/"  || true
          cp scripts/start-go-on.sh                 "$BACKEND_DIR/"  || true
          cp scripts/stop-go-on.sh                  "$BACKEND_DIR/"  || true
          cp scripts/macos-gui-unblock.sh           "$BACKEND_DIR/"  || true
          cp scripts/first-run.sh                   "$BACKEND_DIR/"  || true
          cp MACOS_FIRST_RUN.md                     "$BACKEND_DIR/"  || true
          cp scripts/run-quality-gate.sh            "$BACKEND_DIR/"  || true
          cp scripts/run-release-readiness-gate.sh  "$BACKEND_DIR/"  || true

          chmod +x "$PKG/macos-gui-unblock.sh" 2>/dev/null || true
          chmod +x "$PKG/first-run.sh" 2>/dev/null || true
          chmod +x "$BACKEND_DIR/macos-gui-unblock.sh" 2>/dev/null || true
          chmod +x "$BACKEND_DIR/first-run.sh" 2>/dev/null || true

          # Archive
          tar -czf "${PKG}.tar.gz" "$PKG"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: go-on-release-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
