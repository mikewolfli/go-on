name: Release Full (3-platform package)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "0.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-package-and-upload:
    name: Build + package + upload
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            backend_bin: go-on
            gui_bin: go-on-gui-egui
            archive_ext: tar.gz
          - os: macos-latest
            platform: macos-arm64
            backend_bin: go-on
            gui_bin: go-on-gui-egui
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            backend_bin: go-on.exe
            gui_bin: go-on-gui-egui.exe
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (backend)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "go-on-backend-release"

      - name: Rust cache (GUI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui -> gui/target"
          shared-key: "go-on-gui-release"

      - name: Create SQLite databases
        shell: bash
        run: |
          mkdir -p config
          touch config/acp_cache.sqlite3
          touch config/acp_vector.sqlite3

      # ── Build (default profile: profile-local) ───────────────
      - name: Build backend (release)
        run: cargo build --release --locked

      - name: Build EGUI GUI
        run: cargo build --release --locked --manifest-path gui/Cargo.toml

      - name: Package
        shell: bash
        run: |
          PKG="dist/go-on-${{ matrix.platform }}"
          mkdir -p "$PKG/backend"
          cp "target/release/${{ matrix.backend_bin }}" "$PKG/backend/"
          cp "gui/target/release/${{ matrix.gui_bin }}" "$PKG/"
          cp "gui/icon.ico" "$PKG/"
          cp -r RULES "$PKG/backend/rules"
          cp -r languages "$PKG/backend/"
          cp -r prompts "$PKG/"
          cp -r prompts "$PKG/backend/prompts"
          cp config/config.toml "$PKG/backend/"
          mkdir -p dist/out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd dist && 7z a -tzip "out/go-on-${{ matrix.platform }}.zip" "go-on-${{ matrix.platform }}" && cd ..
          else
            tar -C dist -czf "dist/out/go-on-${{ matrix.platform }}.tar.gz" "go-on-${{ matrix.platform }}"
          fi

      - name: Upload release package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/out/go-on-${{ matrix.platform }}.${{ matrix.archive_ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
