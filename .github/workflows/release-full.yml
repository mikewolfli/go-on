name: Release Backend and GUI

on:
  release:
    types: [published]

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Build Backend
        run: cargo build --release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build GUI
        working-directory: ./GUI
        run: |
          npm install
          npm run build
          npm run tauri build

      - name: Build VS Code addon and package vsix
        working-directory: ./vscode-addon
        run: |
          npm install
          npm run compile
          npm test
          npx @vscode/vsce package --no-dependencies --out go-on-vscode.vsix

      - name: Prepare release package
        run: |
          PKG=go-on-release

          # ── Root: GUI executable + vsix ───────────────────────────────
          mkdir -p "$PKG"
          # Tauri AppImage / binary (Linux)
          GUI_BIN=$(find GUI/src-tauri/target/release/bundle -type f -name "go-on-gui" 2>/dev/null | head -1)
          if [ -z "$GUI_BIN" ]; then
            GUI_BIN=$(find GUI/src-tauri/target/release -maxdepth 1 -type f -name "go-on-gui" 2>/dev/null | head -1)
          fi
          [ -n "$GUI_BIN" ] && cp "$GUI_BIN" "$PKG/"
          # AppImage bundle if present
          APPIMAGE=$(find GUI/src-tauri/target/release/bundle/appimage -name "*.AppImage" 2>/dev/null | head -1)
          [ -n "$APPIMAGE" ] && cp "$APPIMAGE" "$PKG/"
          # vsix
          cp vscode-addon/go-on-vscode.vsix "$PKG/"

          # ── backend/ sub-directory ────────────────────────────────────
          mkdir -p "$PKG/backend"
          cp target/release/go-on                   "$PKG/backend/"
          cp -r RULES                               "$PKG/backend/"
          cp -r languages                           "$PKG/backend/"
          cp config.toml                            "$PKG/backend/"  || true
          cp config.toml.autopilot-adaptive         "$PKG/backend/"  || true
          cp providers.toml                         "$PKG/backend/"  || true
          cp README.md                              "$PKG/backend/"  || true
          cp README.zh-CN.md                        "$PKG/backend/"  || true
          cp start-go-on.sh                         "$PKG/backend/"  || true
          cp stop-go-on.sh                          "$PKG/backend/"  || true

          # ── Archive ────────────────────────────────────────────────────
          tar -czf go-on-full-release.tar.gz "$PKG"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: go-on-full-release.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
