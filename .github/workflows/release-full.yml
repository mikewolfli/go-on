name: Release (build + upload)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "0.*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  build-and-upload:
    name: Build + upload
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache (backend)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "go-on-backend-release"

      - name: Rust cache (GUI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui -> gui/target"
          shared-key: "go-on-gui-release"

      - name: Create SQLite databases
        shell: bash
        run: |
          mkdir -p config
          touch config/acp_cache.sqlite3
          touch config/acp_vector.sqlite3

      # ── Build ────────────────────────────────────────────────
      - name: Build backend (release)
        run: cargo build --release --locked 2>&1

      - name: Build EGUI GUI
        run: cargo build --release --locked --manifest-path gui/Cargo.toml 2>&1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-addon/package-lock.json

      - name: Build VS Code addon
        working-directory: ./vscode-addon
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies --out go-on-vscode.vsix

      # ── Upload ───────────────────────────────────────────────
      - name: Upload all assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/go-on${{ runner.os == 'Windows' && '.exe' || '' }}
            gui/target/release/go-on-gui-egui${{ runner.os == 'Windows' && '.exe' || '' }}
            vscode-addon/go-on-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
