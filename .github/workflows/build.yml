---
name: CI Gate (check + clippy + tests)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: ""
jobs:
  # ── Backend: profiles + tests ───────────────────────────────
  gate-backend:
    name: Backend (3 profiles + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "go-on-backend"

      - name: Create required SQLite databases for CI
        shell: bash
        run: |
          mkdir -p config
          touch config/acp_cache.sqlite3
          touch config/acp_vector.sqlite3

      # ── Profile: local ────────────────────────────────────────
      - name: Check (profile-local)
        run: cargo check --all-targets 2>&1
      - name: Clippy (profile-local)
        run: cargo clippy --no-default-features -F profile-local -- -D warnings
      - name: Unit tests (profile-local)
        run: cargo test --no-default-features -F profile-local --bin go-on 2>&1

      # ── Profile: simple-server ────────────────────────────────
      - name: Clippy (profile-simple-server)
        run: cargo clippy --no-default-features -F profile-simple-server -- -D warnings

      # ── Profile: multi-users-server ───────────────────────────
      - name: Clippy (profile-multi-users-server)
        run: cargo clippy --no-default-features -F profile-multi-users-server -- -D warnings

      # ── Integration tests ─────────────────────────────────────
      - name: Integration tests
        timeout-minutes: 30
        run: cargo test --no-default-features -F profile-local --test acp_runtime_rpc_integration -- --test-threads=1 --nocapture 2>&1
        env:
          GO_ON_ENABLE_LOCAL_TEST_AGENTS: "1"

  # ── EGUI GUI ─────────────────────────────────────────────────
  gate-gui:
    name: GUI (check + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui -> gui/target"
          shared-key: "go-on-gui"
      - name: Check EGUI GUI
        run: cargo check --all-targets --manifest-path gui/Cargo.toml 2>&1
      - name: Test EGUI GUI
        run: cargo test --manifest-path gui/Cargo.toml 2>&1

  # ── VS Code addon ────────────────────────────────────────────
  gate-vscode:
    name: VSCode Addon (compile + lint + contract)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-addon/package-lock.json
      - name: Install dependencies
        run: npm --prefix vscode-addon ci
      - name: TypeScript compile
        run: cd vscode-addon && npx tsc --noEmit
      - name: Lint
        run: npm --prefix vscode-addon run lint
      - name: Contract smoke
        run: npm --prefix vscode-addon run test:contract
