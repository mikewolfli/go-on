---
name: CI Gate (check + clippy + tests)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  gate:
    name: Phase 4 Gate (3 profiles + clippy + tests)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Create required SQLite databases for CI
        shell: bash
        run: |
          mkdir -p config
          touch config/acp_cache.sqlite3
          touch config/acp_vector.sqlite3

      # ── Profile: local ────────────────────────────────────────────────
      - name: Build check (profile-local)
        run: cargo check --all-targets 2>&1
      - name: Clippy (profile-local, deny warnings)
        run: cargo clippy --no-default-features -F profile-local -- -D warnings
      - name: Unit tests (profile-local)
        run: cargo test --no-default-features -F profile-local --bin go-on

      # ── Profile: simple-server ────────────────────────────────────────
      - name: Clippy (profile-simple-server, deny warnings)
        run: cargo clippy --no-default-features -F profile-simple-server -- -D warnings

      # ── Profile: multi-users-server ───────────────────────────────────
      - name: Clippy (profile-multi-users-server, deny warnings)
        run: cargo clippy --no-default-features -F profile-multi-users-server -- -D warnings

      # ── Integration tests ─────────────────────────────────────────────
      - name: Integration tests
        timeout-minutes: 5
        run: cargo test --no-default-features -F profile-local --test acp_runtime_rpc_integration -- --nocapture
        env:
          GO_ON_ENABLE_LOCAL_TEST_AGENTS: "1"

      # ── Front-end ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            GUI/package-lock.json
            vscode-addon/package-lock.json
      - name: Install addon dependencies
        run: npm --prefix vscode-addon ci
      - name: Install GUI dependencies
        run: npm --prefix GUI ci
      - name: VS Code addon compile + lint
        run: npm --prefix vscode-addon run check
      - name: VS Code addon contract smoke
        run: npm --prefix vscode-addon run test:contract
      - name: GUI build
        run: npm --prefix GUI run build
      - name: GUI contract smoke
        run: npm --prefix GUI run test:contract
