---
name: CI Gate (check + lint)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  # ── Backend ──────────────────────────────────────────────
  gate-backend:
    name: Backend (check + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: "go-on-backend"

      - name: Create required SQLite databases
        run: |
          mkdir -p config/sqlite3
          touch config/sqlite3/acp_cache.sqlite3
          touch config/sqlite3/acp_vector.sqlite3

      - name: Validate i18n catalogs (backend / GUI / vscode key sets)
        run: python3 scripts/validate-i18n.py

      - name: Check (all targets, locked)
        run: cargo check --all-targets --locked
      - name: Check (simple-server profile)
        run: cargo check --no-default-features --features simple-server --locked
      - name: Check (multi-users-server profile)
        run: cargo check --no-default-features --features multi-users-server --locked
      - name: Check (full profile)
        run: cargo check --no-default-features --features full --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test (all targets, locked)
        run: cargo test --all-targets --locked
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Cargo deny (advisories / licenses / bans)
        run: cargo deny check

  # ── GUI ──────────────────────────────────────────────────
  gate-gui:
    name: GUI (check + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-composite0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-shape0-dev \
            libgtk-3-dev libdbus-1-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui -> gui/target"
          shared-key: "go-on-gui-check"

      - name: Check (all targets, locked)
        run: cargo check --all-targets --locked --manifest-path gui/Cargo.toml
      - name: Clippy
        run: cargo clippy --all-targets --locked --manifest-path gui/Cargo.toml -- -D warnings

  # ── VS Code addon ────────────────────────────────────────
  gate-vscode:
    name: VSCode Addon (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-addon/package-lock.json

      - name: Install dependencies
        run: npm --prefix vscode-addon ci
      - name: Compile
        run: npm --prefix vscode-addon run compile
      - name: Lint
        run: npm --prefix vscode-addon run lint
