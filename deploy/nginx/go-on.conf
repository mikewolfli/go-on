# go-on production ingress template (Nginx)
# Usage:
# 1) Put TLS cert/key under /etc/nginx/certs/
# 2) Replace server_name and upstream address if needed
# 3) Enable this file and reload nginx

limit_req_zone $binary_remote_addr zone=goon_entry_rpm:10m rate=240r/m;
limit_conn_zone $binary_remote_addr zone=goon_entry_conn:10m;

upstream go_on_backend {
    # Keep backend private; expose only via Nginx TLS ingress.
    server 127.0.0.1:8090;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name go-on.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go-on.example.com;

    ssl_certificate     /etc/nginx/certs/go-on.crt;
    ssl_certificate_key /etc/nginx/certs/go-on.key;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:20m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/go-on.access.log;
    error_log  /var/log/nginx/go-on.error.log warn;

    client_max_body_size 8m;
    keepalive_timeout 65;

    location / {
        limit_req zone=goon_entry_rpm burst=60 nodelay;
        limit_conn goon_entry_conn 64;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        # Client must still provide entry API key accepted by go-on runtime.
        proxy_pass http://go_on_backend;

        proxy_connect_timeout 5s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
