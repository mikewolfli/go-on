---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: go-on-network-policy
  labels:
    app: go-on
    component: server
spec:
  podSelector:
    matchLabels:
      app: go-on
      component: server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8090
          protocol: TCP
