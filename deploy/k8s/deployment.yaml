---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-on
  labels:
    app: go-on
    component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-on
      component: server
  template:
    metadata:
      labels:
        app: go-on
        component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics/prometheus"
    spec:
      serviceAccountName: go-on
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: go-on
          # FIXME(DEPLOY): Replace with your container registry before deploying
          image: registry.example.com/go-on-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/go-on/config.toml
            - --mode
            - acp_http
            - --bind
            - 0.0.0.0:8090
          ports:
            - containerPort: 8090
              protocol: TCP
              name: http
          envFrom:
            - secretRef:
                name: go-on-secrets
                optional: false
          volumeMounts:
            - name: config
              mountPath: /etc/go-on
              readOnly: true
            - name: data
              mountPath: /var/lib/go-on
          startupProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: go-on-config
        - name: data
          persistentVolumeClaim:
            claimName: go-on-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-on-data
  labels:
    app: go-on
    component: server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: standard  # uncomment if your cluster requires an explicit class
---
# ── D4: HorizontalPodAutoscaler ──────────────────────────────────────────────
# Scales go-on replicas based on CPU and memory utilization.
# Requires a metrics server (e.g. Prometheus + metrics-server) to be deployed.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-on-hpa
  labels:
    app: go-on
    component: server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-on
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
