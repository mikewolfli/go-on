apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-on.fullname" . }}
  labels:
    {{- include "go-on.labels" . | nindent 4 }}
    component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol }}
      name: {{ .Values.service.name }}
  selector:
    {{- include "go-on.selectorLabels" . | nindent 4 }}
    component: server
