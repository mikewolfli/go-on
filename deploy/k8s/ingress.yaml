apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-on-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
  - host: go-on.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: go-on-service
            port:
              number: 8090
