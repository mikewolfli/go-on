apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-on-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # FIXME(DEPLOY): Replace with your actual domain before deploying
        - go-on.example.com
      secretName: go-on-tls
  rules:
    # FIXME(DEPLOY): Replace with your actual domain before deploying
    - host: go-on.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-on
                port:
                  number: 8090
