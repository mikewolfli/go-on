# go-on Simple Server — Docker Compose
# Usage: docker compose -f deploy/simple-server/docker-compose.yml up -d

services:
  go-on:
    build:
      context: ../..
      dockerfile: deploy/simple-server/Dockerfile
    image: go-on:simple
    container_name: go-on-simple
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - go-on-data:/var/lib/go-on
      - ../../config/config.simple-server.toml:/opt/go-on/config.toml:ro
    environment:
      - RUST_LOG=warn
      # The mounted config.simple-server.toml enables entry auth and reads
      # provider keys from these env names (keyring is not available inside
      # containers), so the gateway key and the DeepSeek key are required.
      - GO_ON_ENTRY_API_KEY=${GO_ON_ENTRY_API_KEY:?must be set}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?must be set}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8090/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

# NOTE on OpenTelemetry: config.simple-server.toml ships with
# `otel_enabled = true` / `otel_endpoint = "http://localhost:4317"`, but this
# compose file does not provision a collector — inside the container that
# endpoint is the go-on container itself, so OTLP export just logs a warning
# (non-fatal). To silence it, edit the mounted config to
# `otel_enabled = false`; to enable tracing, add an otel-collector service
# (see deploy/multi-users-server/docker-compose.yml) and point the config at
# `http://otel-collector:4317`.

volumes:
  go-on-data:
