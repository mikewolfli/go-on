[package]
name = "go-on-gui-egui"
version = "0.9.4"
edition = "2021"

[dependencies]
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
toml = "0.8"
directories = "6"
rfd = "0.15"
keyring = { version = "3" }
chrono = { version = "0.4", features = ["now"] }
comrak = "0.30"
futures = "0.3"

[build-dependencies]
winres = "0.1"
