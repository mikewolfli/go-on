[package]
name = "go-on-gui-egui"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.34", features = ["wgpu", "glow"] }
egui = "0.34"
reqwest = { workspace = true, features = ["socks"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
directories = "6"
rfd = "0.17"
keyring = { workspace = true, features = ["apple-native"] }
chrono = { version = "0.4", features = ["now"] }
comrak = "0.52"
base64.workspace = true
webbrowser = "1"
tokio-stream.workspace = true
tokio-util.workspace = true
fastrand.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true

[package.metadata.bundle]
name = "Go-On GUI"
identifier = "com.go-on.gui"
icon = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]
sign = false
# macOS bundle settings
osx_minimum_system_version = "12.0"
osx_static_linking = true

[package.metadata.deb]
name = "go-on-gui"
maintainer = "Go-On Team <dev@go-on.dev>"
copyright = "2025 Go-On Contributors"
license_file = "../LICENSE"
long_description = "Go-On is an open-source ACP/MCP intelligent agent orchestration runtime with a cross-platform GUI."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/go-on-gui-egui", "usr/bin/go-on-gui", "755"],
]

[package.metadata.msi]
product_name = "Go-On GUI"
manufacturer = "Go-On Contributors"
authors = ["Go-On Team"]

[build-dependencies]
winres = "0.1"
