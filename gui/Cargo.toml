[package]
name = "go-on-gui-egui"
version = "1.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["wgpu", "glow"] }
egui = "0.31"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "socks", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
directories = "6"
rfd = "0.15"
keyring = { version = "3", features = ["apple-native"] }
chrono = { version = "0.4", features = ["now"] }
comrak = "0.30"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["ico"] }
webbrowser = "1"

[package.metadata.bundle]
name = "Go-On GUI"
identifier = "com.go-on.gui"
icon = ["icons/icon.icns", "icons/icon.ico", "icons/icon.png"]
sign = false
# macOS bundle settings
osx_minimum_system_version = "12.0"
osx_static_linking = true

[package.metadata.deb]
name = "go-on-gui"
maintainer = "Go-On Team <dev@go-on.dev>"
copyright = "2025 Go-On Contributors"
license_file = "../LICENSE"
long_description = "Go-On is an open-source ACP/MCP intelligent agent orchestration runtime with a cross-platform GUI."
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/go-on-gui-egui", "usr/bin/go-on-gui", "755"],
]

[package.metadata.msi]
product_name = "Go-On GUI"
manufacturer = "Go-On Contributors"
authors = ["Go-On Team"]

[build-dependencies]
winres = "0.1"
