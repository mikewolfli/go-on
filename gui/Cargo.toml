[package]
name = "go-on-gui-egui"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "socks", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
directories = "6"
rfd = "0.15"
keyring = { version = "3", features = ["apple-native"] }
chrono = { version = "0.4", features = ["now"] }
comrak = "0.30"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["ico"] }
webbrowser = "1"

[build-dependencies]
winres = "0.1"
