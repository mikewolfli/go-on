[book]
title = "go-on 文檔"
authors = ["GitHub Copilot"]
language = "zh"

[build]
build-dir = "../book/zh-TW"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mikewolfli/go-on"
site-url = "/"
edit-url-template = "https://github.com/mikewolfli/go-on/edit/main/DOC/zh-TW/src/{path}"

[preprocessor.links]
renderers = ["html"]
