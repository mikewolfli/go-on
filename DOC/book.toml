[book]
title = "go-on Documentation"
authors = ["GitHub Copilot"]
language = "en"
src = "src"

[build]
build-dir = "book/en"
create-missing = true

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/mikewolfli/go-on"
site-url = "/"
edit-url-template = "https://github.com/mikewolfli/go-on/edit/main/DOC/src/{path}"

[preprocessor.links]
renderers = ["html"]

[preprocessor.index]
renderers = ["html"]
